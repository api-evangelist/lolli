aid: lolli
name: Lolli
description: 'Lolli is a bitcoin and cash-back rewards company founded in 2018 by CEO Alex Adelman, on
  a mission to make bitcoin accessible to everyone. Through a browser extension, website, and mobile
  app, Lolli gives shoppers a percentage of their purchase back in bitcoin or cash when they shop online
  and in-store at 25,000+ merchants including Adidas, Microsoft, Ulta, and Kroger. Merchants pay Lolli
  for driving sales, and Lolli shares that commission with users as rewards paid into their Lolli wallet.
  The company reports having distributed over $10 million in bitcoin rewards and onboarded thousands of
  people into bitcoin for the first time. Lolli is a consumer product; it does not currently publish a
  public developer API, SDKs, or API documentation. It was surfaced as a portfolio company of
  version-one-ventures and added to the API Evangelist network.'
